name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Smoke and unit tests with the plain interpreter (no installs)
        run: make test
        env:
          PYTHON: python3
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.13"
          python-version: "3.12"
      - name: Install dev tools
        run: uv sync --locked --group dev
      - name: Check (lint, format, types, bandit, actionlint, coverage, docs)
        run: make check
        env:
          # gitleaks runs in the dedicated action below, not through `make security`.
          GITLEAKS_VIA_ACTION: "1"
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
